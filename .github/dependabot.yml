# Only the GitHub Actions of the workflows are kept current: npm dependencies change by hand, with the
# lockfile, size report and notices reviewed together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # Work lands on dev and reaches main through the dev → main pull request, where CI runs.
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
